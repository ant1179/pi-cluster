apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: ai-postgres-backup
  namespace: ai-platform-prod
spec:
  configuration:
    destinationPath: s3://homelab-pi-cnpg-backup/ai-platform-prod/postgres/
    endpointURL: https://s3.eu-central-003.backblazeb2.com

    s3Credentials:
      accessKeyId:
        name: ai-postgres-backup-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: ai-postgres-backup-credentials
        key: ACCESS_SECRET_KEY

    wal:
      compression: gzip

    data:
      compression: gzip

  retentionPolicy: "30d"
