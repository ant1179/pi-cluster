apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-postgres-cnpg
  namespace: forgejo-prod
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  monitoring:
    enablePodMonitor: true
    podMonitorAdditionalLabels:
      release: kube-prometheus-stack
  storage:
    storageClass: synology-iscsi-storage
    size: 30Gi
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: forgejo-backup
