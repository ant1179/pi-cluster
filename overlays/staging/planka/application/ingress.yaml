apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: planka
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - planka-pi.mobol-homelab.net
      secretName: planka-tls

  rules:
    - host: planka-pi.mobol-homelab.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: planka
                port:
                  number: 80
