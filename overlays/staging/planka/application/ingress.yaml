apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: planka
spec:
  ingressClassName: traefik
  rules:
    - host: planka-pi.mobol-homelab.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: planka
                port:
                  number: 80
