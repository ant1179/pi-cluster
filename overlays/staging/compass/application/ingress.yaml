apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: compass
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - compass-pi.mobol-homelab.net
      secretName: compass-tls
  rules:
    - host: compass-pi.mobol-homelab.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: compass
                port:
                  number: 3000
