apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: synology-dsm
spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - nas.mobol-homelab.net
      secretName: nas-tls

  rules:
    - host: nas.mobol-homelab.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: synology-dsm
                port:
                  number: 80
