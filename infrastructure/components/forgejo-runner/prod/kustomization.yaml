apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forgejo-runner-prod

resources:
  - ../base
  - instance-config.yaml
  - secret.yaml
  - namespace.yaml

patches:
  - path: deployment-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: ^forgejo-runner$
