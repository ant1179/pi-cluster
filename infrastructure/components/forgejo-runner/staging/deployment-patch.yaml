apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
spec:
  template:
    spec:
      containers:
        - name: runner
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2375
        - name: docker
          args:
            - --tls=false
            - --insecure-registry=forgejo.forgejo-staging.svc.cluster.local:3000

