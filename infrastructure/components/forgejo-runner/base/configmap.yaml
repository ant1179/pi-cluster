apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config

data:
  config.yaml: |
    log:
      level: info

    runner:
      file: .runner
      capacity: 1
      timeout: 3h
      insecure: false
      fetch_timeout: 5s
      fetch_interval: 2s
      envs:
        DOCKER_HOST: tcp://localhost:2375
      labels:
        - "ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-22.04"

    cache:
      enabled: true
      dir: /data/cache

    container:
      privileged: false
      docker_host: tcp://localhost:2375
