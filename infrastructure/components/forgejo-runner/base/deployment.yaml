apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  labels:
    app.kubernetes.io/name: forgejo-runner
    app.kubernetes.io/component: runner
    app.kubernetes.io/instance: forgejo-runner

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner

  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
        app.kubernetes.io/component: runner
        app.kubernetes.io/instance: forgejo-runner

    spec:
      securityContext:
        fsGroup: 1000

      initContainers:
        - name: register-runner
          image: data.forgejo.org/forgejo/runner:6.4.0
          imagePullPolicy: IfNotPresent

          command:
            - sh
            - -c
            - |
              if [ ! -s /data/.runner ]; then
                echo "Registering runner..."

                cd /data

                forgejo-runner register \
                  --no-interactive \
                  --instance "${FORGEJO_INSTANCE}" \
                  --token "${RUNNER_TOKEN}" \
                  --name "${RUNNER_NAME}"
              else
                echo "Runner already registered"
              fi

          env:
            - name: FORGEJO_INSTANCE
              valueFrom:
                configMapKeyRef:
                  name: forgejo-runner-instance
                  key: FORGEJO_INSTANCE

            - name: RUNNER_NAME
              valueFrom:
                configMapKeyRef:
                  name: forgejo-runner-instance
                  key: RUNNER_NAME

            - name: RUNNER_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-secret
                  key: RUNNER_SECRET

          volumeMounts:
            - name: runner-data
              mountPath: /data

      containers:
        - name: docker
          image: docker:29.0.0-dind
          imagePullPolicy: IfNotPresent

          args:
            - --tls=false

          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""

          securityContext:
            privileged: true

          ports:
            - containerPort: 2375
              protocol: TCP

          volumeMounts:
            - name: docker-storage
              mountPath: /var/lib/docker

        - name: runner
          image: data.forgejo.org/forgejo/runner:6.4.0

          command:
            - sh
            - -c
            - |
              echo "Waiting for Docker daemon..."

              until wget -q -O- http://localhost:2375/version >/dev/null 2>&1; do
                sleep 1
              done

              echo "Docker is ready!"

              cp /data/.runner .runner

              forgejo-runner daemon \
                --config /config/config.yaml

          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2375

          volumeMounts:
            - name: runner-data
              mountPath: /data

            - name: config
              mountPath: /config

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

      restartPolicy: Always

      volumes:
        - name: runner-data
          persistentVolumeClaim:
            claimName: forgejo-runner-data

        - name: docker-storage
          persistentVolumeClaim:
            claimName: forgejo-runner-docker-cache

        - name: config
          configMap:
            name: forgejo-runner-config
