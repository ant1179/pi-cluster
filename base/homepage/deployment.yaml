apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest

          ports:
            - name: http
              containerPort: 3000

          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "*"
            - name: LOG_TARGETS
              value: "stdout"

          volumeMounts:
            - name: config
              mountPath: /app/config

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

          readinessProbe:
            httpGet:
              path: /
              port: http

          livenessProbe:
            httpGet:
              path: /
              port: http

      volumes:
        - name: config
          configMap:
            name: homepage-config
