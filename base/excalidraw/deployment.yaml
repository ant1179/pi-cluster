apiVersion: apps/v1
kind: Deployment
metadata:
  name: excalidraw
spec:
  replicas: 1

  selector:
    matchLabels:
      app: excalidraw

  template:
    metadata:
      labels:
        app: excalidraw

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: excalidraw
          image: excalidraw/excalidraw:latest

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            #   runAsNonRoot: true
            capabilities:
              drop:
                - NET_RAW
                - MKNOD
                - AUDIT_WRITE
                - SETFCAP
                # - CHOWN
                - FOWNER
                - FSETID
                - KILL

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
