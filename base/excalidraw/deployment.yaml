apiVersion: apps/v1
kind: Deployment
metadata:
  name: excalidraw
spec:
  replicas: 1

  selector:
    matchLabels:
      app: excalidraw

  template:
    metadata:
      labels:
        app: excalidraw

    spec:
      securityContext:
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: excalidraw
          image: excalidraw/excalidraw:latest

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101 # default nginx user
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3

          volumeMounts:
            - name: nginx-default-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-cache
              mountPath: /var/cache/nginx

      volumes:
        - name: nginx-default-config
          configMap:
            name: excalidraw-nginx-default
        - name: nginx-config
          configMap:
            name: excalidraw-nginx
        - name: nginx-cache
          emptyDir: {}
