apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
spec:
  replicas: 1

  selector:
    matchLabels:
      app: vikunja

  template:
    metadata:
      labels:
        app: vikunja

    spec:
      containers:
        - name: vikunja
          image: vikunja/vikunja:2.4.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3456
              name: http

          env:
            - name: VIKUNJA_DATABASE_TYPE
              value: postgres

            - name: VIKUNJA_DATABASE_HOST
              value: vikunja-postgres-rw

            - name: VIKUNJA_DATABASE_PORT
              value: "5432"

            - name: VIKUNJA_DATABASE_DATABASE
              value: vikunja

            - name: VIKUNJA_DATABASE_USER
              value: vikunja

            - name: VIKUNJA_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vikunja-postgres-app
                  key: password

            - name: VIKUNJA_SERVICE_PUBLICURL
              value: https://vikunja.mobol-homelab.net/

          volumeMounts:
            - name: files
              mountPath: /app/vikunja/files

          readinessProbe:
            httpGet:
              path: /api/v1/info
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/v1/info
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: vikunja-files
