apiVersion: apps/v1
kind: Deployment
metadata:
  name: unstructured
spec:
  replicas: 1

  selector:
    matchLabels:
      app: unstructured

  template:
    metadata:
      labels:
        app: unstructured

    spec:
      containers:
        - name: unstructured
          image: quay.io/unstructured-io/unstructured-api:latest

          ports:
            - name: http
              containerPort: 8000

          env:
            - name: PORT
              value: "8000"

          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30

          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
